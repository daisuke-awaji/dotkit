    <script>
      try { if (localStorage.getItem("dk-theme") === "dark") document.documentElement.classList.add("dk-theme-dark"); } catch {}
      try {
        var q = new URLSearchParams(location.search).get("lang"), s = localStorage.getItem("dk-lang");
        document.documentElement.lang = q === "ja" || q === "en" ? q : s === "ja" || s === "en" ? s : /^ja\b/i.test(navigator.language) ? "ja" : "en";
      } catch {}
    </script>
